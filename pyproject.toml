[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sv-cli"
version = "0.5.0"
description = "Open-source, definition-driven command-line client for SV AI API tools."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "SV CLI Contributors"}
]
keywords = ["seo", "cli", "sv", "ai", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities"
]
dependencies = [
  "typer>=0.9",
  "httpx>=0.25",
  "rich>=13.6",
  "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8",
  "build>=1.0",
  "twine>=4.0"
]

[project.urls]
Homepage = "https://github.com/seovendorco/sv-cli"
Issues = "https://github.com/seovendorco/sv-cli/issues"

[project.scripts]
sv = "sv_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sv_cli"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
